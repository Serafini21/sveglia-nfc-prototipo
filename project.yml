name: Alba
options:
  deploymentTarget:
    iOS: "26.1"
  developmentLanguage: it # frasi di Siri e testi base in italiano
targets:
  Alba:
    type: application
    platform: iOS
    sources:
      - path: Alba
      - path: Sounds # generata da scripts/genera_suoni.py prima di xcodegen
        buildPhase: resources
      - path: Fonts # scaricata dal workflow (Space Grotesk e Inter, OFL)
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Alba
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)" # numero della build di GitHub Actions
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [SpaceGrotesk.ttf, Inter.ttf]
        NSAlarmKitUsageDescription: "Alba usa le sveglie di sistema per suonare all'orario scelto, anche con il telefono bloccato o in silenzioso."
        NSAppleMusicUsageDescription: "Alba mette in pausa Apple Music quando suona la sveglia e la fa ripartire quando la spegni."
        NSLocationWhenInUseUsageDescription: "Alba usa la posizione solo per salvare la casa e, quando spegni la sveglia senza tag, per sapere se sei fuori casa."
        UIBackgroundModes: [audio] # guardiano: chiave di Info.plist, nessuna capability a pagamento (va bene col Personal Team)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.svegliatag.alba # definitivo: non cambiarlo mai (cancellerebbe i dati)
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Alba/Assets.xcassets, generata da scripts/genera_icona.py
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
