name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'prototipo/**', '.github/workflows/prototipo.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Seleziona l'Xcode 26 più recente
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Test delle regole (logica pura)
        run: |
          mkdir -p build-test
          xcrun --sdk macosx swiftc -swift-version 5 -o build-test/test_regole \
            Alba/Modello.swift Alba/Regole.swift Tests/main.swift
          ./build-test/test_regole

      - name: Scarica i font (Space Grotesk e Inter, licenza OFL)
        run: |
          mkdir -p Fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          if curl -fsSL "$base/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" -o Fonts/SpaceGrotesk.ttf \
            && curl -fsSL "$base/spacegrotesk/OFL.txt" -o Fonts/OFL-SpaceGrotesk.txt \
            && curl -fsSL "$base/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o Fonts/Inter.ttf \
            && curl -fsSL "$base/inter/OFL.txt" -o Fonts/OFL-Inter.txt; then
            ls -la Fonts
          else
            echo "::warning::Font non scaricati: l'app userà i font di sistema"
            rm -f Fonts/*
          fi

      - name: Genera suoni e progetto
        run: |
          python3 scripts/genera_suoni.py Sounds
          brew install xcodegen
          xcodegen generate

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild -project Alba.xcodeproj -scheme Alba \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | grep -E "error:|warning:|BUILD" | grep -v "appintentsmetadataprocessor" | tail -n 150

      - name: Crea .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Alba.app Payload/
          ls Payload/Alba.app
          test -d Payload/Alba.app/Metadata.appintents || echo "::warning::Metadata App Intents mancante: l'azione potrebbe non comparire in Comandi Rapidi"
          zip -qry Alba.ipa Payload
          ls -lh Alba.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Alba-ipa
          path: Alba.ipa
