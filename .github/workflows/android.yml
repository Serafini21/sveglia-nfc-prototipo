name: Build APK

# L'app Android (cartella android/). Parte solo quando cambia qualcosa che la riguarda.
on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/genera_suoni.py', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Chiave di firma (sempre la stessa, altrimenti l'aggiornamento cancella i dati)
        env:
          KEYSTORE_BASE64: ${{ secrets.ALBA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Mancano i secrets ALBA_KEYSTORE_BASE64 e ALBA_KEYSTORE_PASSWORD (vedi android/README.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alba.jks"
          echo "ALBA_KEYSTORE=$RUNNER_TEMP/alba.jks" >> "$GITHUB_ENV"

      - name: Genera i suoni (stesso script dell'app iPhone)
        run: python3 ../scripts/genera_suoni.py app/src/main/assets/suoni

      - name: Scarica i font (Space Grotesk e Inter, licenza OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          if curl -fsSL "$base/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" -o app/src/main/assets/fonts/SpaceGrotesk.ttf \
            && curl -fsSL "$base/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o app/src/main/assets/fonts/Inter.ttf; then
            ls -la app/src/main/assets/fonts
          else
            echo "::warning::Font non scaricati: l'app userà i font di sistema"
            rm -f app/src/main/assets/fonts/*
          fi

      - name: Test delle regole e build
        env:
          ALBA_KEYSTORE_PASSWORD: ${{ secrets.ALBA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Alba.apk
          ls -lh Alba.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Alba-apk
          path: android/Alba.apk
